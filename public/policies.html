<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/css/policies-page.css"><title>Policies</title><link rel="stylesheet" href="/css/loading.css?v=final1"><script defer src="/redesign.js?v=2"></script><script src="/site-context.js"></script><script defer src="/js/seo.js?v=1"></script><style>.policy-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}.policy-field,.policy-section{padding:18px;border:1px solid rgba(0,0,0,.09);border-radius:14px;background:#fff}.policy-field strong{display:block;margin-bottom:6px}.policy-section{margin-top:18px}.policy-section h2{margin-top:0}.policy-copy{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.policy-empty{text-align:center;padding:28px}</style></head><body><header class="nav"><a class="brand" href="/">AutoClick<span>Mouse</span></a></header><main class="shell"><div class="order"><h1>Privacy &amp; Policies</h1><div id="policyContent" aria-live="polite"></div></div></main><script>(()=>{const root=document.getElementById('policyContent'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const info=[['STORE_NAME','Store Name'],['COMPANY_NAME','Company Name'],['EMAIL','Email'],['MOBILE','Mobile'],['ADDRESS','Address']];const sections=[['PRIVACY_POLICY','Privacy Policy'],['SHIPPING_POLICY','Shipping Policy'],['RETURN_POLICY','Return Policy'],['REFUND_POLICY','Refund Policy'],['TERMS_AND_CONDITIONS','Terms & Conditions'],['DISCLAIMER','Disclaimer']];async function load(){try{const r=await fetch('/api/site-content/policies',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Policy load failed');const x=await r.json(),top=info.filter(([k])=>String(x[k]||'').trim()),body=sections.filter(([k])=>String(x[k]||'').trim());root.innerHTML=(top.length?`<section aria-labelledby="storeInformation"><h2 id="storeInformation">Store Information</h2><div class="policy-info">${top.map(([k,l])=>`<div class="policy-field"><strong>${l}</strong><span class="policy-copy">${esc(x[k])}</span></div>`).join('')}</div></section>`:'')+body.map(([k,l],i)=>`<section class="policy-section" aria-labelledby="policy-${i}"><h2 id="policy-${i}">${l}</h2><div class="policy-copy">${esc(x[k])}</div></section>`).join('')+(!top.length&&!body.length?'<p class="policy-empty">Policy information is not available for this website yet.</p>':'')}catch(e){root.innerHTML='<p class="policy-empty">Policies could not be loaded. Please try again later.</p>'}}load()})();</script><script src="/js/loading.js?v=final1"></script></body></html>
