<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/css/faq-page.css"><title>FAQs</title><link rel="stylesheet" href="/css/loading.css?v=final1"><script defer src="/WEBSITE_DESIGN.js?v=1"></script></head><body><header class="nav"><a class="brand" href="/">AutoClick<span>Mouse</span></a><div class="search"><input id="globalSearch" placeholder="Search AutoClickerMouse"><button>🔍</button></div><div class="navlinks"><button class="pill dark" id="adminBtn">Admin</button><button class="pill dark" id="ordersBtn">My Orders</button><a href="/review">Reviews</a><a href="/FAQs">FAQs</a><a href="/cart">Cart <span class="count" id="cartCount">0</span></a></div></header><main class="shell"><div class="toolbar"><input id="fq" placeholder="Search FAQs"><select id="fc"><option value="">All</option><option>General</option><option>Payment</option><option>Delivery</option><option>Services</option></select></div><div id="list" class="faq"></div></main><script>(()=>{const data=[["General", "How do I open product details?", "Click any product image, title or Details button."], ["Payment", "How do coupons work?", "Apply an active coupon in the shopping cart before checkout."], ["Delivery", "How do I track my order?", "Open My Orders with the registered mobile number."], ["Services", "How is warranty claimed?", "Submit all three ratings and a review from My Orders."]],$=s=>document.querySelector(s);function run(){let q=$('#fq').value.toLowerCase(),c=$('#fc').value;$('#list').innerHTML=data.filter(x=>(x.join(' ').toLowerCase().includes(q))&&(!c||x[0]===c)).map((x,i)=>`<div><button class="q">${i+1}. ${x[1]}</button><div class="a"><p>${x[2]}</p><button class="pill" onclick="alert('Thanks for your feedback')">Helpful</button></div></div>`).join('');document.querySelectorAll('.q').forEach(b=>b.onclick=()=>b.nextElementSibling.style.display=b.nextElementSibling.style.display==='block'?'none':'block')}fq.oninput=fc.onchange=run;run()})();</script><div class="modal" id="login"><div class="panel"><button class="close">×</button><h2 id="loginTitle"></h2><form id="loginForm"><div class="field"><label id="loginLabel"></label><input id="loginInput" inputmode="numeric" required></div><div class="notice" id="loginMsg"></div><button class="pill primary">Continue</button></form></div></div><script src="/js/common.js"></script><script src="/js/loading.js?v=final1"></script></body></html>
