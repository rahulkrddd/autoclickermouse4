<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/css/faq-page.css"><title>FAQs</title><link rel="stylesheet" href="/css/loading.css?v=final1"><script defer src="/redesign.js?v=2"></script><script src="/site-context.js"></script><script defer src="/js/seo.js?v=1"></script></head><body><header class="nav"><a class="brand" href="/">AutoClick<span>Mouse</span></a><div class="search"><input id="globalSearch" placeholder="Search AutoClickerMouse"><button>🔍</button></div><div class="navlinks"><button class="pill dark" id="adminBtn">Admin</button><button class="pill dark" id="ordersBtn">My Orders</button><a href="/review">Reviews</a><a href="/FAQs">FAQs</a><a href="/cart">Cart <span class="count" id="cartCount">0</span></a></div></header><main class="shell"><div class="toolbar"><input id="fq" placeholder="Search FAQs"><select id="fc"><option value="">All</option></select></div><div id="list" class="faq" aria-live="polite"></div></main><script>(()=>{let data=[],$=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function run(){const q=$('#fq').value.trim().toLowerCase(),c=$('#fc').value;const rows=data.filter(x=>(`${x.question} ${x.answer}`.toLowerCase().includes(q))&&(!c||x.category===c));$('#list').innerHTML=rows.length?rows.map((x,i)=>`<div><button class="q" type="button" aria-expanded="false">${i+1}. ${esc(x.question)}</button><div class="a"><p>${esc(x.answer)}</p><button class="pill helpful" type="button">Helpful</button></div></div>`).join(''):`<div class="order"><p>${data.length?'No FAQs match your search.':'No FAQs are available for this website yet.'}</p></div>`;document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{const a=b.nextElementSibling,open=a.style.display==='block';a.style.display=open?'none':'block';b.setAttribute('aria-expanded',String(!open))});document.querySelectorAll('.helpful').forEach(b=>b.onclick=()=>alert('Thanks for your feedback'))}async function load(){try{const r=await fetch('/api/site-content/faqs',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('FAQ load failed');const payload=await r.json();data=Array.isArray(payload)?payload:[];run()}catch(e){data=[];$('#list').innerHTML='<div class="order"><p>FAQs could not be loaded. Please try again later.</p></div>'}}$('#fq').oninput=run;$('#fc').onchange=run;load()})();</script><script src="/js/nav-active.js?v=1"></script><script src="/js/loading.js?v=final1"></script></body></html>
